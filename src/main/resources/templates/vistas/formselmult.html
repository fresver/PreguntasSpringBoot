<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Selección Múltiple</title>
	<link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>

<body class="bg-dark text-white">
	
	<div th:replace="vistas/fragmentos/fragments::navbar"></div>

	<div class="container mt-5">
		<h2>Agregar pregunta de selección múltiple</h2>
		<form th:action="@{/preguntaSelMult/guardar}" th:object="${preguntaSelMult}" method="post">
			<div class="mb-3">
				<label for="preguntaSelMult" class="form-label">Enunciado</label>
				<input type="text" id="enunciado" th:field="*{enunciado}" name="enunciado" class="form-control" required>
			</div>

			<div id="opciones-container" class="mb-3">
				<label class="form-label">Opciones</label>
				<div class="opcion-item">
					<input type="text" class="form-control mb-2" name="opciones[]" required placeholder="Opción 1">
				</div>
			</div>

			<button type="button" id="btn-add-opcion" class="btn btn-success">Añadir Opción</button>

			<div id="respuestas-container" class="mb-3">
				<label class="form-label">Respuestas correctas</label>
				<div class="respuestas-item">
					<input type="text" class="form-control mb-2" name="respuestasCorrectas[]" required placeholder="Respuesta 1">
				</div>
			</div>

			<button type="button" id="btn-add-respuesta" class="btn btn-success">Añadir Respuesta</button>

			<div class="mb-3">
				<label for="tematica" class="form-label">Temática</label> 
				<select id="tematica" th:field="*{tematica}" class="form-control" required> 
					<option th:each="tematica : ${T(com.questions.dam2.entity.Tematica).values()}" th:value="${tematica}" th:text="${tematica.tematica}"></option> 
				</select>
			</div>

			<button type="submit" class="btn btn-primary">Guardar pregunta</button>
		</form>
	</div>

	<script th:inline="javascript">
		document.getElementById('btn-add-opcion').addEventListener('click', function () {
				var newOption = document.createElement('div');
				newOption.classList.add('opcion-item');

				var input = document.createElement('input');
				input.type = 'text';
				input.classList.add('form-control', 'mb-2');
				input.name = 'opciones[]';
				input.placeholder = 'Nueva opción';
				input.required = true;

				newOption.appendChild(input);
				document.getElementById('opciones-container').appendChild(newOption);
			});

		document.getElementById('btn-add-respuesta').addEventListener('click', function () {
				var newRespuesta = document.createElement('div');
				newRespuesta.classList.add('respuestas-item');

				var input = document.createElement('input');
				input.type = 'text';
				input.classList.add('form-control', 'mb-2');
				input.name = 'respuestasCorrectas[]';
				input.placeholder = 'Nueva respuesta';
				input.required = true;

				newRespuesta.appendChild(input);
				document.getElementById('respuestas-container').appendChild(newRespuesta);
			});
	</script>

	<script src="/bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
