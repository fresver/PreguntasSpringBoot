<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Jugar</title>
	<link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>

<body class="bg-dark text-white">

	<div th:replace="vistas/fragmentos/fragments::navbar"></div>

	<div th:if="${listaPreguntas.empty}" class="text-center mt-5">
		<p>No hay preguntas disponibles para jugar.</p>
	</div>

	<form action="/validarTrueFalse" method="post" class="container mt-5">
		<div th:each="pregunta : ${listaPreguntas}" class="mb-4">
			<p th:text="${pregunta.enunciado}" class="h5 text-center"></p>
			<div class="d-flex justify-content-center gap-4">
				<label>
					<input type="radio" th:name="${pregunta.id}" value="true"> Verdadero
				</label>
				<label>
					<input type="radio" th:name="${pregunta.id}" value="false"> Falso
				</label>
			</div>
		</div>
		<div class="text-center">
			<button type="submit" class="btn btn-primary mt-3">Enviar</button>
		</div>
	</form>

	<div th:replace="vistas/fragmentos/fragments::footer"></div>

	<script src="/bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
